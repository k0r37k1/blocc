name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Determine changed production files
        run: |
          git fetch --tags --force

          if git rev-parse deployed >/dev/null 2>&1; then
            echo "Deploying changes since last deploy tag"
            git diff --name-only deployed HEAD > raw_changed.txt
          else
            echo "No deploy tag found — deploying all production files"
            git ls-files > raw_changed.txt
          fi

          # Always include freshly built frontend assets
          find public/build -type f >> raw_changed.txt

          # Filter out non-production files
          sort -u raw_changed.txt | grep -vE \
            "^(tests/|Upload/|\.github/|node_modules/|vendor/|storage/|\.planning/|\.junie/|playwright|\.phpunit|\.DS_Store|\.env|database/[^m])" | \
            grep -vE "^(\.gitattributes|\.gitignore|\.mcp\.json|CLAUDE\.md|INSTALL|LICENSE|README\.md|biome\.json|boost\.json|package\.json|package-lock\.json|phpstan\.neon|phpunit\.xml)$" \
            > deploy_files.txt

          echo "=== Files to deploy ($(wc -l < deploy_files.txt)) ==="
          cat deploy_files.txt

      - name: Build deploy directory
        run: |
          mkdir -p _deploy
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              mkdir -p "_deploy/$(dirname "$file")"
              cp "$file" "_deploy/$file"
            fi
          done < deploy_files.txt

      - name: Upload via FTP
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            open -u '${{ secrets.FTP_USER }}','${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_HOST }};
            mirror --reverse --verbose \
              _deploy/ ${{ secrets.FTP_SERVER_DIR }}/;
          "

      - name: Run post-deploy commands via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ${{ secrets.FTP_SERVER_DIR }}
            rm -f public/sitemap.xml
            /opt/plesk/php/8.4/bin/php artisan down || true
            /opt/plesk/php/8.4/bin/php composer.phar install --no-dev --optimize-autoloader --no-interaction
            /opt/plesk/php/8.4/bin/php composer.phar dump-autoload -o --no-interaction
            /opt/plesk/php/8.4/bin/php artisan migrate --force --no-interaction || true
            /opt/plesk/php/8.4/bin/php artisan storage:link --force --no-interaction || true
            /opt/plesk/php/8.4/bin/php artisan filament:upgrade --no-interaction || true
            /opt/plesk/php/8.4/bin/php artisan optimize:clear --no-interaction
            /opt/plesk/php/8.4/bin/php artisan view:cache --no-interaction || true
            /opt/plesk/php/8.4/bin/php artisan optimize --no-interaction
            /opt/plesk/php/8.4/bin/php -r 'require "vendor/autoload.php"; echo "PageObserver=". (class_exists("App\\Observers\\PageObserver") ? "yes" : "no") . PHP_EOL;'
            /opt/plesk/php/8.4/bin/php artisan up || true

      - name: Update deployed tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f deployed
          git push origin -f deployed
